[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gov-monitor"
version = "0.1.0"
description = "官公庁ページ更新監視システム"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "anthropic>=0.40.0",
    "gspread>=6.0.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
gov-monitor = "gov_monitor.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=gov_monitor --cov-report=term-missing --cov-fail-under=80"
